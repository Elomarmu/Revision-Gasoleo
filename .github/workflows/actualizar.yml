
name: Actualizar precios del gasóleo

on:
  schedule:
    # Cada 2 horas de miércoles a viernes, de 07:17 a 21:17 UTC (8:17 a 22:17 en invierno en España).
    # Solo se guarda un cambio cuando el Ministerio ha publicado datos nuevos.
    - cron: "17 7-21/2 * * 3-5"
  workflow_dispatch: {}
  # También al cambiar el script o esta tarea, para comprobar que siguen funcionando.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl==3.1.5

      - name: Descargar y leer la Excel del Ministerio
        run: python scripts/actualizar.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data.json; then
            echo "Sin cambios en data.json"
            exit 0
          fi
          git config user.name "actualizador-gasoleo"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "Precios del gasóleo actualizados"
          git push
